<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Waves results: time to first token and bytes read, before and after">
<style>
  text { font-family: Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif; fill: #1b1b1a; }
  .h { font-size: 18px; font-weight: 700; } .l { font-size: 14px; fill: #52514e; }
  .v { font-size: 14px; font-weight: 600; opacity: 0; animation: fade .6s ease-out forwards; }
  .g { font-size: 13px; fill: #52514e; }
  .b { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes fade { to { opacity: 1; } }
</style>
<rect width="1000" height="380" rx="16" fill="#fcfcfb" stroke="#e2e1dc"/>
<rect x="590" y="22" width="14" height="14" rx="3" fill="#2a78d6"/><text x="610" y="34" class="l">token at a time (MISS_QD=8)</text>
<rect x="800" y="22" width="14" height="14" rx="3" fill="#eb6834"/><text x="820" y="34" class="l">+ waves</text>
<text x="30" y="70" class="h">⏱  Time to first token, 514-token prompt</text>
<text x="96" y="114" class="l" text-anchor="end">cap 12</text>
<rect class="b" x="110" y="94" width="760.0" height="18" rx="4" fill="#2a78d6" style="animation-delay:0.25s"/>
<text class="v" x="878.0" y="108" style="animation-delay:1.35s">376 s</text>
<rect class="b" x="110" y="116" width="60.6" height="18" rx="4" fill="#eb6834" style="animation-delay:0.60s"/>
<text class="v" x="178.6" y="130" style="animation-delay:1.70s">30.0 s</text>
<text class="v g" x="970" y="128" text-anchor="end" style="animation-delay:1.75s">−92%</text>
<text x="96" y="172" class="l" text-anchor="end">cap 32</text>
<rect class="b" x="110" y="152" width="446.7" height="18" rx="4" fill="#2a78d6" style="animation-delay:0.95s"/>
<text class="v" x="564.7" y="166" style="animation-delay:2.05s">221 s</text>
<rect class="b" x="110" y="174" width="95.0" height="18" rx="4" fill="#eb6834" style="animation-delay:1.30s"/>
<text class="v" x="213.0" y="188" style="animation-delay:2.40s">47.0 s</text>
<text class="v g" x="970" y="186" text-anchor="end" style="animation-delay:2.45s">−79%</text>
<text x="30" y="226" class="h">💾  Expert bytes read from disk, 514-token prompt</text>
<text x="96" y="270" class="l" text-anchor="end">cap 12</text>
<rect class="b" x="110" y="250" width="760.0" height="18" rx="4" fill="#2a78d6" style="animation-delay:1.65s"/>
