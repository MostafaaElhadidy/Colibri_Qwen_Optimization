<text class="v" x="211.6" y="286" style="animation-delay:3.10s">34.8 GB</text>
<text class="v g" x="970" y="284" text-anchor="end" style="animation-delay:3.15s">−88%</text>
<text x="96" y="328" class="l" text-anchor="end">cap 32</text>
<rect class="b" x="110" y="308" width="378.4" height="18" rx="4" fill="#2a78d6" style="animation-delay:2.35s"/>
<text class="v" x="496.4" y="322" style="animation-delay:3.45s">141 GB</text>
